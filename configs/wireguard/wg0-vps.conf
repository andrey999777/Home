# WireGuard-хаб на VPS (Helsinki).
# Windows и NAS становятся пирами одной сети 10.10.0.0/24.
# Трафик фильмов при такой схеме всё ещё идёт через VPS,
# пока не появится прямой peer-to-peer / Tailscale direct.
#
# sysctl:
#   net.ipv4.ip_forward=1
#   net.ipv6.conf.all.forwarding=1
#
# firewall (nftables/ufw): UDP 51821, форвард между wg0 и собой.

[Interface]
Address = 10.10.0.1/24
ListenPort = 51821
PrivateKey = VPS_PRIVATE_KEY
MTU = 1280

# Если на VPS есть отдельный WAN-интерфейс — раскомментируйте NAT
# только для выхода в интернет, не для доступа к NAS:
# PostUp   = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT
# PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT

[Peer]
# Домашний NAS / файловый сервер
PublicKey = HOME_PUBLIC_KEY
AllowedIPs = 10.10.0.2/32, 192.168.1.0/24
PersistentKeepalive = 25

[Peer]
# Удалённый Windows 10
PublicKey = WINDOWS_PUBLIC_KEY
AllowedIPs = 10.10.0.3/32
PersistentKeepalive = 25
